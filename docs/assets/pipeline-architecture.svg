<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">SSAFY VLM-VQA pipeline architecture</title>
  <desc id="desc">An image, a question, and four choices are scored by Qwen3-VL and Qwen3.5. Choice-rotation TTA is applied to Qwen3.5, probabilities are ensembled, exact matches are corrected, and a submission CSV is produced.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#059669"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .title{font:700 34px Inter,Segoe UI,Arial,sans-serif;fill:#0f172a}
      .subtitle{font:400 17px Inter,Segoe UI,Arial,sans-serif;fill:#475569}
      .box-title{font:700 20px Inter,Segoe UI,Arial,sans-serif;fill:#fff}
      .box-copy{font:500 15px Inter,Segoe UI,Arial,sans-serif;fill:#e2e8f0}
      .light-title{font:700 20px Inter,Segoe UI,Arial,sans-serif;fill:#0f172a}
      .light-copy{font:500 15px Inter,Segoe UI,Arial,sans-serif;fill:#475569}
      .tag{font:700 13px Inter,Segoe UI,Arial,sans-serif;fill:#1e3a8a;letter-spacing:.4px}
      .arrow{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="650" rx="26" fill="url(#bg)"/>
  <text class="title" x="60" y="62">VLM-VQA inference pipeline</text>
  <text class="subtitle" x="60" y="92">Answer-token scoring, choice-rotation TTA, and probability ensembling</text>

  <g filter="url(#shadow)">
    <rect x="60" y="210" width="210" height="170" rx="22" fill="#fff"/>
    <rect x="80" y="230" width="62" height="48" rx="12" fill="#dbeafe"/>
    <circle cx="100" cy="249" r="8" fill="#60a5fa"/>
    <path d="M86 270l16-14 12 10 9-7 13 11" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="light-title" x="80" y="315">Input sample</text>
    <text class="light-copy" x="80" y="343">Image + Korean question</text>
    <text class="light-copy" x="80" y="367">Four choices: a / b / c / d</text>
  </g>

  <path class="arrow" d="M270 274 C320 274 320 190 370 190"/>
  <path class="arrow" d="M270 320 C320 320 320 430 370 430"/>

  <g filter="url(#shadow)">
    <rect x="370" y="120" width="270" height="145" rx="22" fill="url(#blue)"/>
    <text class="box-title" x="395" y="162">Qwen3-VL family</text>
    <text class="box-copy" x="395" y="193">4B / 8B · NF4 QLoRA</text>
    <text class="box-copy" x="395" y="219">Next-token a–d probabilities</text>
    <rect x="395" y="232" width="125" height="23" rx="11" fill="#fff" opacity=".2"/>
    <text x="410" y="249" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#fff">BASE MODELS</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="370" y="355" width="270" height="165" rx="22" fill="url(#purple)"/>
    <text class="box-title" x="395" y="397">Qwen3.5-35B-A3B</text>
    <text class="box-copy" x="395" y="428">4-bit QLoRA · 320 steps</text>
    <text class="box-copy" x="395" y="454">Choice-rotation TTA</text>
    <text class="box-copy" x="395" y="480">Restore positions, average probs</text>
    <rect x="395" y="492" width="142" height="23" rx="11" fill="#fff" opacity=".2"/>
    <text x="410" y="509" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#fff">DIVERSE MEMBER</text>
  </g>

  <path class="arrow" d="M640 190 C700 190 690 270 745 282"/>
  <path class="arrow" d="M640 438 C700 438 690 350 745 338"/>

  <g filter="url(#shadow)">
    <rect x="745" y="230" width="205" height="155" rx="22" fill="#fff"/>
    <text class="tag" x="770" y="267">SOFT ENSEMBLE</text>
    <text class="light-title" x="770" y="302">Weighted average</text>
    <text class="light-copy" x="770" y="330">48% Qwen3-VL family</text>
    <text class="light-copy" x="770" y="354">52% Qwen3.5 + TTA</text>
    <rect x="770" y="368" width="155" height="6" rx="3" fill="#dbeafe"/>
    <rect x="770" y="368" width="74" height="6" rx="3" fill="#2563eb"/>
    <rect x="844" y="368" width="81" height="6" rx="3" fill="#8b5cf6"/>
  </g>

  <path class="arrow" d="M950 307 H1002"/>

  <g filter="url(#shadow)">
    <rect x="1002" y="205" width="150" height="205" rx="22" fill="url(#green)"/>
    <text class="box-title" x="1024" y="252">Finalization</text>
    <text class="box-copy" x="1024" y="286">argmax a–d</text>
    <text class="box-copy" x="1024" y="317">Exact-match</text>
    <text class="box-copy" x="1024" y="339">correction</text>
    <rect x="1024" y="360" width="106" height="31" rx="10" fill="#fff" opacity=".92"/>
    <text x="1040" y="381" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="13" font-weight="700" fill="#047857">id,answer</text>
  </g>

  <text class="subtitle" x="60" y="598">Every candidate is validated for row count, id order, columns, and a–d labels before submission.</text>
</svg>


